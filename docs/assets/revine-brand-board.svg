  <text x="748" y="64" fill="#f8faf6" font-family="Arial, Helvetica, sans-serif" font-size="20" letter-spacing="4">PRIMARY LOGO · DARK</text>
  <g fill="url(#mark)" transform="translate(78 100) scale(.65)">
